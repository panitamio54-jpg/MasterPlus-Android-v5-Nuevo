name: Compilar CapPlayer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "CapPlayer_GitHub_Ready_v1.zip"
      - ".github/workflows/compilar-capplayer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API 37
        shell: bash
        run: |
          sdkmanager "platforms;android-37" "platform-tools"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Configurar Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q CapPlayer_GitHub_Ready_v1.zip -d buildsrc
          echo "=== Proyecto descomprimido ==="
          ls -la buildsrc
          test -f buildsrc/settings.gradle.kts
          test -f buildsrc/app/build.gradle.kts
          echo "sdk.dir=$ANDROID_SDK_ROOT" > buildsrc/local.properties

      - name: Compilar APK
        working-directory: buildsrc
        shell: bash
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verificar APK
        shell: bash
        run: |
          APK="buildsrc/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: CapPlayer-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
