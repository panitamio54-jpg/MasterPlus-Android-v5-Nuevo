name: Compilar CapPlayer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "CapPlayer_GitHub_Ready_v1.zip"
      - ".github/workflows/compilar-capplayer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Descomprimir proyecto
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q CapPlayer_GitHub_Ready_v1.zip -d buildsrc
          echo "=== Proyecto descomprimido ==="
          ls -la buildsrc
          test -f buildsrc/settings.gradle.kts
          test -f buildsrc/app/build.gradle.kts

      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: no se encontró sdkmanager."
            find /usr/local/lib/android/sdk -maxdepth 4 -type f -name "sdkmanager*" 2>/dev/null || true
            exit 1
          fi

          echo "sdkmanager encontrado en: $SDKMANAGER"
          chmod +x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "platform-tools"

          echo "sdk.dir=$SDKROOT" > buildsrc/local.properties
          cat buildsrc/local.properties

      - name: Compilar APK
        working-directory: buildsrc
        shell: bash
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verificar APK
        shell: bash
        run: |
          APK="buildsrc/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Subir APK
        uses: actions/upload-artifact@v6
        with:
          name: CapPlayer-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
