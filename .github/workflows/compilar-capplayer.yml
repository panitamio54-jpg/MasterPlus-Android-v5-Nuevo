name: Compilar CapPlayer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "CapPlayer_GitHub_Ready_v1.zip"
      - ".github/workflows/compilar-capplayer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Descomprimir proyecto
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q CapPlayer_GitHub_Ready_v1.zip -d buildsrc
          echo "Contenido:"
          ls -la buildsrc

      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37"
          echo "sdk.dir=$ANDROID_HOME" > buildsrc/local.properties

      - name: Compilar APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          test -f buildsrc/app/build/outputs/apk/debug/app-debug.apk
          ls -lh buildsrc/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: CapPlayer-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
